
[env]
TERM = "xterm-256color"

[font]
size = 13.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

[scrolling]
history = 5000

[window]
decorations = "full"
dynamic_padding = false
opacity = 0.95
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 6
y = 6

[general]
import = [
    "~/.config/alacritty/themes/cyber_punk_neon.toml"
]

[terminal]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"
