# Outputs are configured at startup by ~/.config/sway/configure-outputs.sh.
#
# The script handles three default cases:
# 1. Laptop only: use the internal display
# 2. External only: use the external display
# 3. Laptop + one external: place the external display above the laptop
#
# For local machine-specific overrides, create:
# ~/.config/sway/local/outputs.env
#
# Useful discovery command from inside Sway:
# swaymsg -t get_outputs -r | jq -r '.[] | select(.active) | "\(.name) \(.rect.width)x\(.rect.height) @ \(.rect.x),\(.rect.y)"'
