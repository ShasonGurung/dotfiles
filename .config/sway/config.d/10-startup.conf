exec_always --no-startup-id "$HOME/.config/sway/exec-if-installed.sh" import-gsettings \
  gtk-theme:gtk-theme-name \
  icon-theme:gtk-icon-theme-name \
  cursor-theme:gtk-cursor-theme-name

exec_always --no-startup-id "$HOME/.config/sway/configure-outputs.sh"
exec_always --no-startup-id "$HOME/.config/sway/live-wallpaper.sh" stop
exec --no-startup-id "$HOME/.config/sway/exec-if-installed.sh" swayidle -w \
  before-sleep "$HOME/.config/wlogout/custom_lock.sh" \
  lock "$HOME/.config/wlogout/custom_lock.sh"
exec --no-startup-id "$HOME/.config/sway/exec-if-installed.sh" udiskie -s --file-manager=thunar
